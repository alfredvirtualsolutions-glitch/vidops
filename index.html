<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VidOps – Floridablanca PIO Video</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; background: #111; color: #eee; }
    main { max-width: 800px; margin: 0 auto; }
    .video-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
    .video-wrap iframe, .video-wrap button { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .video-wrap button { background: #1877f2; color: #fff; font-size: 1.25rem; cursor: pointer; }
    a { color: #8ab4ff; }
  </style>
</head>
<body>
  <main>
    <h1>Floridablanca PIO Video</h1>
    <!-- Lazy-loaded: the Facebook iframe is only inserted when the user clicks play. -->
    <div class="video-wrap" id="fb-video">
      <button type="button" id="play">▶ Load video</button>
    </div>
    <p><a href="https://www.facebook.com/FloridablancaPIO/videos/1483713303818875/" target="_blank" rel="noopener">Watch on Facebook</a></p>
  </main>
  <script>
    const href = encodeURIComponent("https://www.facebook.com/FloridablancaPIO/videos/1483713303818875/");
    document.getElementById("play").addEventListener("click", () => {
      const iframe = document.createElement("iframe");
      iframe.src = `https://www.facebook.com/plugins/video.php?href=${href}&show_text=false&width=560&t=0`;
      iframe.allow = "autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share";
      iframe.allowFullscreen = true;
      iframe.loading = "lazy";
      iframe.scrolling = "no";
      document.getElementById("fb-video").replaceChildren(iframe);
    });
  </script>
</body>
</html>
